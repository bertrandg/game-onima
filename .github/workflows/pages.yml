name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Les tests doivent passer avant toute mise en ligne
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests unitaires et vérifications
        run: npm test
      - name: Tests dans le navigateur (Chrome, rendu logiciel)
        run: npm run test:e2e

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Ajoute la version (commit) aux fichiers CSS/JS : le navigateur ne peut pas mélanger
      # une page récente avec des fichiers d'une ancienne version gardés en cache
      - name: Versionner les fichiers
        run: |
          V="${GITHUB_SHA::8}"
          sed -i "s#css/style.css#css/style.css?v=$V#; s#js/main.js#js/main.js?v=$V#; s#img/chara.svg#img/chara.svg?v=$V#" index.html
          # imports statiques et dynamiques (niveaux chargés à la demande), y compris dans les sous-dossiers
          find js -name '*.js' -exec sed -i -E "s#((from |import\()'\.{1,2}/[a-z./]+\.js)'#\1?v=$V'#g" {} +
          grep -n "?v=" index.html
          grep -rc "?v=" js | grep -v ':0$'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
