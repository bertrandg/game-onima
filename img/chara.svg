<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" id="chara">
  <defs>
    <linearGradient id="gHair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e5653"/>
      <stop offset="0.55" stop-color="#1d3836"/>
      <stop offset="1" stop-color="#152a29"/>
    </linearGradient>
    <linearGradient id="gHairBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b3533"/>
      <stop offset="1" stop-color="#0f2120"/>
    </linearGradient>
    <linearGradient id="gSkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9da"/>
      <stop offset="1" stop-color="#ffd9c4"/>
    </linearGradient>
    <linearGradient id="gIris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26104a"/>
      <stop offset="0.45" stop-color="#5a33aa"/>
      <stop offset="0.8" stop-color="#9c78e6"/>
      <stop offset="1" stop-color="#d8c2ff"/>
    </linearGradient>
    <linearGradient id="gTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc283"/>
      <stop offset="1" stop-color="#4f9a5d"/>
    </linearGradient>
    <linearGradient id="gSleeve" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#78bf80"/>
      <stop offset="1" stop-color="#4a9058"/>
    </linearGradient>
    <linearGradient id="gSkirt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5e1d38"/>
      <stop offset="0.3" stop-color="#8a2d50"/>
      <stop offset="0.7" stop-color="#8a2d50"/>
      <stop offset="1" stop-color="#5e1d38"/>
    </linearGradient>
    <radialGradient id="gBlush" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff7d94" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff7d94" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    #chara .ol { stroke: #2a1d26; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
    #chara .eyes-closed { opacity: 0; }
    /* animations : respiration, clignement, queue, oreilles, pattes */
    #chara * { transform-box: fill-box; }
    #chara .body-anim { animation: ch-breathe 2.8s ease-in-out infinite; transform-origin: 50% 100%; transform-box: view-box; }
    #chara .eye { animation: ch-blink 4.2s infinite; transform-origin: 50% 55%; }
    #chara .eyes-closed { animation: ch-blink-c 4.2s infinite; }
    #chara .tail { animation: ch-tail 2.2s ease-in-out infinite; transform-origin: 0% 100%; }
    #chara .ear-l { animation: ch-ear-l 5s ease-in-out infinite; transform-origin: 80% 100%; }
    #chara .ear-r { animation: ch-ear-r 5s ease-in-out infinite 0.4s; transform-origin: 20% 100%; }
    #chara .paw { animation: ch-paw 1.1s ease-in-out infinite; transform-origin: 50% 100%; }
    #chara .arm-r .paw { animation-delay: 0.55s; }
    #chara .braid { animation: ch-braid 2.8s ease-in-out infinite; transform-origin: 50% 0%; }
    #chara .ribbon { animation: ch-ribbon 3s ease-in-out infinite; transform-origin: 30% 60%; }
    @keyframes ch-breathe { 0%, 100% { transform: translateY(0) scale(1, 1); } 50% { transform: translateY(-4px) scale(1.01, 0.99); } }
    @keyframes ch-blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.08); } }
    @keyframes ch-blink-c { 0%, 93%, 98%, 100% { opacity: 0; } 94%, 97% { opacity: 1; } }
    @keyframes ch-tail { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(7deg); } }
    @keyframes ch-ear-l { 0%, 80%, 100% { transform: rotate(0); } 84% { transform: rotate(-9deg); } 88% { transform: rotate(2deg); } }
    @keyframes ch-ear-r { 0%, 80%, 100% { transform: rotate(0); } 84% { transform: rotate(9deg); } 88% { transform: rotate(-2deg); } }
    @keyframes ch-paw { 0%, 100% { transform: rotate(-6deg) translateY(0); } 50% { transform: rotate(6deg) translateY(-3px); } }
    @keyframes ch-braid { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
    @keyframes ch-ribbon { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-8deg); } }
  </style>

