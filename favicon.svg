    <circle cx="24.5" cy="42.5" r="0.55"/><circle cx="26" cy="43.6" r="0.55"/><circle cx="24.6" cy="44.4" r="0.55"/>
    <circle cx="39.5" cy="42.5" r="0.55"/><circle cx="38" cy="43.6" r="0.55"/><circle cx="39.4" cy="44.4" r="0.55"/>
