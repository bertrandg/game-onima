      <stop offset="0" stop-color="#ffe0ec"/>
      <stop offset="1" stop-color="#ffa9cb"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f5552"/>
      <stop offset="1" stop-color="#1a3231"/>
