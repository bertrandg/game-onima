  <!-- joues, taches de rousseur, bouche ω -->
  <ellipse cx="20.5" cy="43.5" rx="3" ry="1.6" fill="#ff8fa0" opacity="0.6"/>
  <ellipse cx="43.5" cy="43.5" rx="3" ry="1.6" fill="#ff8fa0" opacity="0.6"/>
