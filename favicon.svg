  <rect x="45.8" y="30" width="5.2" height="19" rx="1" fill="url(#hair)"/>
  <!-- ruban violet -->
  <path d="M51 22 L57 18 L57.5 25 Z M51 22 L55 28.5 L49 27.5 Z" fill="#4a7fd0"/><circle cx="51.2" cy="23.5" r="1.6" fill="#3a68b8"/>
